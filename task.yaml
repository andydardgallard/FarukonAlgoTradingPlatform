priority: high

mode: auto

acceptance_criteria:
  - "Запуск Farukon_2 с конфигом SYMI_Ch_SMA_up_lmt_lshade_mpr_add_dd_wide.json (в точности) проходит от начала до конца без паники, exit code 0."
  - "В opt_results/apr_dd_test_from_kimi появляются НЕпустые файлы результатов оптимизации."
  - "Все Python-визуализации, связанные с алгоритмом/оптимизатором, запускаются на полученных результатах и завершаются без исключений, строят графики."
  - "Подозрение проверено документированно: либо подтверждено и первая популяция формируется случайным выбором (как в GA, что соответствует статьям LSHADE-RSP), либо приложен RUST_BACKTRACE=1 с точным местом аллокации и устранён истинный баг."
  - "Параметры соответствуют статьям: memory_size H=5, p_best=0.085 с формулой p = 0.085 + 0.085*NFE/NFEmax, archive_rate=1.0, адаптация F/Cr (Коши/нормальное), Lehmer mean, LPSR."
  - "Задействовано указаное в параметре 'threads:' конфига колличество потоков."
  - "Вывод в терминал аналогичен указанному."
  - "Потребление памяти адекватное (нет аллокаций порядка ГБ/ТБ на старте)."
  - "Нет регрессий: Genetic_Search и Grid_Search работают как до изменений."

business_tests:
  - scenario: "Полный боевой прогон LSHADE_RSP на конфиге в точности"
    config: "portfolios/SYMI_Ch_SMA_up_lmt_lshade_mpr_add_dd_wide.json"
    expected_results: "Прогон завершается с кодом 0; в opt_results/apr_dd_test_from_kimi записаны непустые файлы результатов; память в норме."
  - scenario: "Python-визуализации на результатах прогона"
    config: "opt_results/apr_dd_test_from_kimi"
    expected_results: "Все скрипты визуализации, связанные с алгоритмом, отрабатывают без исключений и строят графики."
  - scenario: "Регрессия существующих оптимизаторов"
    config: "существующий конфиг Genetic_Search"
    expected_results: "Genetic_Search/Grid_Search работают как до изменений, без регрессий."

