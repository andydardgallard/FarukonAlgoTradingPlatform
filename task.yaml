title: "LSHADE-RSP аварийно завершается на старте боевого конфига (аллокация ~1.9 ТБ) — исправить и добиться полного прогона с визуализациями"

repo_path: .

description: |
  При первом боевом прогоне оптимизатора LSHADE_RSP на реальных данных (41 символ CNY,
  включая synth_) с конфигурацией SYMI_Ch_SMA_up_lmt_lshade_mpr_add_dd_wide.json процесс
  падает сразу после загрузки данных при "global_data_storage_mode": "deep":

      Starting to load and process FlatBuffer SOA files from ../../Tickers_fbs/soa/CNY...
      GlobalDataStore loaded and processed in 0.416 seconds
      Symbols loaded: 41
      memory allocation of 1924304548880 bytes failed
      note: run with RUST_BACKTRACE=1 environment variable to display a backtrace
    и при "global_data_storage_mode": "arc":
        Starting to load and process FlatBuffer SOA files from ../../Tickers_fbs/soa/CNY...
        GlobalDataStore loaded and processed in 0.391 seconds
        Symbols loaded: 41
        memory allocation of 1652537109376 bytes failed
        memory allocation of 1652537110176 bytes failed
        skipping backtrace printing to avoid potential recursion 

  Попытка выделить ~1.9 ТБ — очевидно НЕкорректный размер (мусорное/неинициализированное
  значение или ошибочный расчёт capacity), а не реальная потребность: популяция 250 особей
  по 5+1 параметров — это килобайты, а не терабайты.

  ПОДОЗРЕНИЕ ЗАКАЗЧИКА (проверить в первую очередь): сбой происходит в момент формирования
  первоначальной популяции (population_size = 250).
  Проверить по статьям (папка upgrade - LSHADE-RSP: CEC 2018 stanovov20183.pdf и ICINCO 2018 68525.pdf):
  исходная популяция в LSHADE/SHADE инициализируется равномерно-случайно в границах
  параметров (xi,j = rand(xL,j, xU,j), формула (2) в CEC 2018). То есть случайный выбор
  первой популяции, КАК В ГЕНЕТИЧЕСКОМ АЛГОРИТМЕ (Genetic_Search), ПОЛНОСТЬЮ соответствует
  алгоритму и может быть переиспользован.
  ЕСЛИ подозрение подтверждается — переиспользовать код случайной инициализации из GA.
  ЕСЛИ НЕТ — снять RUST_BACKTRACE=1, найти точное место аллокации и устранить баг
  (неинициализированная память, переполнение при расчёте capacity, неверный размер буфера
  фитнесов/архива/популяции и т.п.).

  После исправления — ПОЛНЫЙ прогон оптимизации на конфиге В ТОЧНОСТИ как ниже, от начала
  до конца, с записью файлов результатов и успешным выполнением всех Python-визуализаций,
  связанных с этим алгоритмом.

