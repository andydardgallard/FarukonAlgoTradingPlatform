# =============================================================================
# TASK FILE for the Autonomous Code Factory
# Задача: интеграция LSHADE-RSP в FarukonAlgoTradingPlatform
# =============================================================================

# --- Краткое название задачи (1 предложение, бизнес-язык) --------------------
# Обязательное поле.
title: "Добавить алгоритм оптимизации LSHADE-RSP третьим оптимизатором платформы, не ухудшив существующие алгоритмы"

# --- Путь к существующему репозиторию (для проектов, которые уже есть) -------
# Опционально.
repo_path: .

# --- Описание задачи (бизнес-язык, без технических деталей) ------------------
# Обязательное поле. Многострочное (используйте | для блока текста).
description: |
  Платформа подбирает параметры торговых стратегий с помощью собственного
  генетического алгоритма Genetic_Search. Нужно добавить ещё один алгоритм
  оптимизации по научным статьям из папки upgrade — LSHADE-RSP / NL-SHADE-RSP
  (дифференциальная эволюция с ранговым селективным давлением; референсная
  реализация: https://github.com/VladimirStanovov/LSHADE-RSP.git).

  Новый алгоритм должен стать третьим полноценным оптимизатором платформы:
  выбираться через конфигурационные файлы, работать с ядром и со всеми
  файлами визуализации из папки Python, использовать те же данные и те же
  целевые функции (max APR/DD, max Composite), что и существующие алгоритмы.

  Работа двух предыдущих алгоритмов оптимизации не должна быть затронута.

  После успешного выполнения задачи необходимо обновить README проекта:
  - подробно описать, как запускать новый оптимизатор (команды, примеры);
  - перечислить все его настройки;
  - для каждой настройки объяснить, что она делает и на что влияет;
  - указать рекомендуемые диапазоны значений для каждой настройки.

# --- Приоритет ----------------------------------------------------------------
# Опционально. Допустимо: high | medium | low. По умолчанию: medium.
priority: high

# --- Режим работы -------------------------------------------------------------
# Опционально. hitl (по умолчанию) | auto.
mode: auto

# --- Критерии приёмки (что считается успехом) --------------------------------
# Опционально. Список бизнес-критериев, которые пользователь сможет проверить
# лично после завершения. Фабрика подтверждает каждый критерий с доказательством.
acceptance_criteria:
  - "LSHADE-RSP зарегистрирован в платформе как третий оптимизатор и запускается через конфиг наравне с существующими алгоритмами."
  - "Два предыдущих алгоритма оптимизации работают как прежде: то же поведение, те же результаты, без регрессий."
  - "Файлы визуализации из папки Python работают с результатами нового оптимизатора."
  - "Пройдены 4 бизнес-сценария: наборы инструментов Si-*.25 и Si-*.23 x целевые функции max APR/DD и max Composite; фабрика сама сформировала конфиги по образцам из папки portfolios и сохранила новые конфиги в ту же папку."
  - "На одинаковых данных LSHADE-RSP работает быстрее Genetic_Search и находит решение не хуже по значению целевой функции."
  - "Все замеры (время работы, лучшие параметры, значения целевых функций обоих алгоритмов) собраны в отдельный файл сравнительного отчёта в репозитории."
  - "README обновлён: описан запуск оптимизатора, полный список настроек, для каждой настройки — что делает, на что влияет и рекомендуемые диапазоны значений."

# --- Бизнес-тесты (сценарии проверки) ----------------------------------------
# Опционально. Если не заполнить — фабрика уточнит их у пользователя на этапе
# планирования (в режиме hitl).
business_tests:
  - scenario: "LSHADE-RSP: портфель Si-*.25, цель max APR/DD"
    symbols: ["Si-3.25", "Si-6.25", "Si-9.25", "Si-12.25"]
    objective: "max APR/DD"
    config: "portfolios/lshade_si_25_apr_dd.json — фабрика генерирует по образцам из portfolios/"
    expected_results: "Оптимизация завершается без паник, CSV с результатами создан, хотя бы у одной комбинации Deals_Count > 0"

  - scenario: "LSHADE-RSP: портфель Si-*.25, цель max Composite"
    symbols: ["Si-3.25", "Si-6.25", "Si-9.25", "Si-12.25"]
    objective: "max Composite"
    config: "portfolios/lshade_si_25_composite.json — фабрика генерирует по образцам из portfolios/"
    expected_results: "Оптимизация завершается без паник, CSV с результатами создан, Composite посчитан для всех комбинаций"

  - scenario: "LSHADE-RSP: портфель Si-*.23, цель max APR/DD"
    symbols: ["Si-3.23", "Si-6.23", "Si-9.23", "Si-12.23"]
    objective: "max APR/DD"
    config: "portfolios/lshade_si_23_apr_dd.json — фабрика генерирует по образцам из portfolios/"
    expected_results: "Оптимизация завершается без паник, CSV с результатами создан, хотя бы у одной комбинации Deals_Count > 0"

  - scenario: "LSHADE-RSP: портфель Si-*.23, цель max Composite"
    symbols: ["Si-3.23", "Si-6.23", "Si-9.23", "Si-12.23"]
    objective: "max Composite"
    config: "portfolios/lshade_si_23_composite.json — фабрика генерирует по образцам из portfolios/"
    expected_results: "Оптимизация завершается без паник, CSV с результатами создан, Composite посчитан для всех комбинаций"

  - scenario: "Сравнительный бенчмарк: Genetic_Search против LSHADE-RSP на тех же 4 сценариях"
    config: "те же 4 конфига прогоняются обоими оптимизаторами с одинаковой сеткой параметров"
    expected_results: "В репозитории создан файл сравнительного отчёта: время работы и лучшие значения целевых функций обоих алгоритмов по каждому сценарию; LSHADE-RSP не медленнее и не хуже по качеству"

  - scenario: "Регрессия: существующие алгоритмы на старых конфигах из portfolios/"
    config: "существующие конфиги portfolios/"
    expected_results: "Результаты идентичны дотеграционным, регрессий нет"

# --- Файлы, которые НЕЛЬЗЯ коммитить в git -----------------------------------
# Опционально. Glob-паттерны относительно корня репозитория. Фабрика может
# менять эти файлы (бэкапы/тесты/откат), но никогда не добавит их в коммит.
commit_exclude:
  - "opt_results/**"
  - "opt_results_si/**"
  - "target/**"

# --- Переопределение моделей для ролей ---------------------------------------
# Опционально. Позволяет переопределить модели из .agents/agents/models.yaml
# для конкретной задачи.
models:
  analyzer: deepseek-v4-pro
  planner: deepseek-v4-pro
  coder: deepseek-v4-pro
  tester: deepseek-v4-flash
  diagnostician: deepseek-v4-pro