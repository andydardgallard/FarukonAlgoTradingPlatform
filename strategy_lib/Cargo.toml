[package]
name = "strategy_lib"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.99"
serde_json = "1.0.143"
farukon_core = { path = "../farukon_core" }
chrono = { version = "0.4.41", features = ["serde"] }
# The dll's internal allocations go through mimalloc. No heap object crosses the FFI boundary
# any more: signals are marshalled through the host emission callback in `farukon_core::event`,
# so the host allocates and frees the event itself.
mimalloc = "0.1.52"
